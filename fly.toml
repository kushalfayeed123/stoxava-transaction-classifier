# Fly.io alternative to Render. Free/hobby allowance covers small services
# like this comfortably.
#
#   1. Install flyctl, then from this directory: `fly launch --no-deploy`
#      (it will detect the Dockerfile and pre-fill this file -- keep the
#      values below or let it overwrite them).
#   2. `fly secrets set GEMINI_API_KEY=...` (optional, for the LLM backend).
#   3. `fly deploy`
#
app = "transaction-classifier"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  method = "GET"
