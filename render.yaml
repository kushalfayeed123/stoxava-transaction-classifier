# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Quickest path to a free, shareable URL:
#   1. Push this repo to GitHub.
#   2. On Render: New -> Blueprint -> pick the repo -> Apply.
#      Render reads this file automatically and creates the service below.
#   3. Set LLM_PROVIDER and LLM_API_KEY in the service's Environment tab.
#      Recommended: LLM_PROVIDER=groq with LLM_API_KEY from console.groq.com
#      (llama-3.1-8b-instant: ~50ms latency, 30k RPM free tier)
#      Falls back to MockClassifier if no key is set.
#
# Free-tier notes: 
# - Instance sleeps after ~15 min idle (cold start ~10-30s)
# - For demo, use "curl https://your-app.onrender.com/health" every 10min to keep warm
# - Consider Fly.io (fly.toml) for always-on free tier with 3 shared-CPU VMs
services:
  - type: web
    name: transaction-classifier
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Resource limits for free tier (512MB RAM, 0.1 CPU)
    # gunicorn with 2 workers fits in 512MB
    envVars:
      - key: LLM_PROVIDER
        value: "groq"  # fastest free tier for classification
      - key: LLM_API_KEY
        sync: false  # set manually in dashboard
      - key: LOG_LEVEL
        value: "INFO"
      - key: PORT
        value: "8000"
